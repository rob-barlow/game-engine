<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/ui/styles.css">
    <link rel="stylesheet" href="./src/ui/ui.css">
    <link rel="stylesheet" href="./src/ui/settings-menu.css">
    <link rel="stylesheet" href="./src/ui/ui-controls.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Dev</title>
  </head>
  <body>

    <canvas id="cpu-canvas" width="600" height="600"></canvas>
    <canvas id="gpu-canvas" width="600" height="600"></canvas>

    <div class="ui-overlay">
      <div class="ui-panel main-menu">
        <h1 class="ui-title">the fungeon</h1>

        <div class="ui-text">
          <p>STATUS: ONLINE</p>
          <p>OBJECTIVE: GET TO THE END</p>
          <p>AWAITING PLAYER INPUT...</p>
        </div>

        <button class="play-button" type="button">
          CLICK HERE TO PLAY!
        </button>
      </div>

      <div class="ui-controls">

        <button class="settings-button" type="button">
          [ SETTINGS ]
        </button>

        <div class="scene-selector">

          <button class="scenes-button" type="button">
            [ RANDOM ]
          </button>

          <div class="scenes-menu">
            <button class="scene-option selected" id="maze-scene" data-scene="maze">> MAZE</button>
            <button class="scene-option" id="rabbit-scene" data-scene="rabbit">> RABBIT</button>
            <button class="scene-option" id="depth-scene" data-scene="depth">> DEPTH</button>
          </div>

        </div>

        <div class="renderer-selector">

          <button class="renderer-button" type="button">
            [ TOGGLE RENDERER ]
          </button>

          <div class="renderer-menu">
            <p class="renderer-option selected" id="webgl-renderer" data-renderer="cpu">> CPU</p>
            <p class="renderer-option" id="canvas-renderer" data-renderer="gpu">> GPU</p>
          </div>
        
        </div>
      </div>
        
      <div class="ui-panel settings-menu">
        <h1 class="ui-title">settings</h1>

        <div class="ui-text">
          <label>
            MOUSE SENSITIVITY
            <input class="mouse-sensitivity-input" type="range" min="1" max="100" value="50">
          </label>
        </div>

        <button class="back-button" type="button">
          &lt; BACK
        </button>
      </div>
    </div>

    <script type="module" src="/src/main/script.ts"></script> 

  </body>
</html>
