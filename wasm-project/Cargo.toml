[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "maze-explorer"
version = "0.1.0"
edition = "2024"
description = "a web app where you explore a maze"
repository = "none"

[dependencies]
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageData", "Node", "Window", "console"] }
